project_id = "medsentry"

[db]
major_version = 17

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.vector]
enabled = false

[auth]
enabled = true
# Accounts are provisioned by administrators through the provision-user
# function; public self sign-up stays closed.
enable_signup = false
# Links in auth emails must point at the production app, not localhost.
site_url = "https://www.medsentryrhu.com"
additional_redirect_urls = [
  "https://www.medsentryrhu.com",
  "https://medsentryrhu.com",
  "http://localhost:*",
  "http://127.0.0.1:*",
]

# Staff and RHU Admin verify every login with a 6-digit code sent by email.
# The app's code entry (kOtpLength / kOtpLifetime in login_challenge.dart)
# must match otp_length and otp_expiry. Apply with `supabase config push`.
[auth.email]
# This turns the whole email provider on or off (password and OTP login),
# not only sign-ups. Keep it true; [auth] enable_signup = false above is
# what closes public sign-up.
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 300
max_frequency = "60s"

[auth.email.template.magic_link]
subject = "Your MedSentry verification code"
content_path = "./supabase/templates/otp.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Supabase's built-in mailer only delivers to project team members and is
# heavily rate limited. Configure custom SMTP (Gmail app password, Resend,
# etc.) before going live. Keep secrets in env vars.
# Custom SMTP (Gmail, medsentrymanagement@gmail.com) is configured in the
# Supabase Dashboard so its app password never enters this public repo.
# Leave this block commented out: `config push` then leaves it untouched.
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(SMTP_PASSWORD)"
# admin_email = "no-reply@your-domain.example"
# sender_name = "MedSentry"

[functions.provision-user]
verify_jwt = true
