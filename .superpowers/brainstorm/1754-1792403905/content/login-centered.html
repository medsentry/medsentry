<div class="mockup">
  <div class="mockup-header">MedSentry login · centered layout preview</div>
  <div class="mockup-body">
    <style>
      #medsentry-login-preview,
      #medsentry-login-preview * {
        box-sizing: border-box;
      }

      #medsentry-login-preview {
        --preview-bg: #101312;
        --preview-panel: #181c1a;
        --preview-border: #343b37;
        --preview-text: #f5f7f6;
        --preview-muted: #aab2ae;
        --preview-green: #20c997;
        min-height: 590px;
        display: grid;
        place-items: center;
        padding: 28px;
        background: var(--preview-bg);
        color: var(--preview-text);
        font: 14px/1.5 Inter, "Segoe UI", sans-serif;
      }

      #medsentry-login-preview .login-panel {
        width: min(100%, 430px);
        padding: 34px;
        background: var(--preview-panel);
        border: 1px solid var(--preview-border);
        border-radius: 12px;
      }

      #medsentry-login-preview .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 30px;
        font-size: 15px;
        font-weight: 700;
      }

      #medsentry-login-preview .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        color: #071510;
        background: var(--preview-green);
        border-radius: 8px;
      }

      #medsentry-login-preview .brand-mark svg {
        width: 19px;
        height: 19px;
      }

      #medsentry-login-preview h2 {
        margin: 0;
        color: var(--preview-text);
        font-size: 27px;
        line-height: 1.2;
        letter-spacing: -0.03em;
      }

      #medsentry-login-preview .intro {
        margin: 8px 0 25px;
        color: var(--preview-muted);
        font-size: 14px;
      }

      #medsentry-login-preview .field {
        margin-top: 17px;
      }

      #medsentry-login-preview label {
        display: block;
        margin-bottom: 7px;
        color: var(--preview-text);
        font-size: 13px;
        font-weight: 600;
      }

      #medsentry-login-preview .input {
        display: flex;
        min-height: 46px;
        align-items: center;
        gap: 11px;
        padding: 0 13px;
        border: 1px solid var(--preview-border);
        border-radius: 7px;
        background: #131614;
        color: var(--preview-muted);
      }

      #medsentry-login-preview .input svg,
      #medsentry-login-preview .remember svg,
      #medsentry-login-preview .secure svg {
        width: 17px;
        height: 17px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      #medsentry-login-preview .input .trailing {
        margin-left: auto;
      }

      #medsentry-login-preview .input-label {
        color: #d7dcda;
      }

      #medsentry-login-preview .form-options {
        display: flex;
        min-height: 44px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 5px 0 16px;
        color: var(--preview-muted);
        font-size: 12px;
      }

      #medsentry-login-preview .remember {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #medsentry-login-preview .remember svg {
        color: var(--preview-green);
      }

      #medsentry-login-preview .link {
        color: var(--preview-green);
        font-weight: 600;
      }

      #medsentry-login-preview .submit {
        width: 100%;
        min-height: 46px;
        border: 0;
        border-radius: 7px;
        background: var(--preview-green);
        color: #071510;
        font: inherit;
        font-weight: 700;
      }

      #medsentry-login-preview .secure {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin-top: 22px;
        color: var(--preview-muted);
        font-size: 11px;
        text-align: center;
      }

      @media (max-width: 520px) {
        #medsentry-login-preview {
          min-height: 560px;
          padding: 18px;
        }

        #medsentry-login-preview .login-panel {
          padding: 25px 21px;
        }
      }
    </style>
    <main id="medsentry-login-preview" aria-label="Centered MedSentry sign-in preview">
      <section class="login-panel">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3 19 6v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3Z"/>
              <path d="M12 8v8M8 12h8"/>
            </svg>
          </span>
          <span>MedSentry</span>
        </div>
        <h2>Welcome back</h2>
        <p class="intro">Sign in to securely access your clinic workspace.</p>
        <div class="field">
          <label>Email Address</label>
          <div class="input">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
            <span class="input-label">name@rhu.gov.ph</span>
          </div>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="input">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
            <span class="input-label">••••••••••</span>
            <svg class="trailing" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/><path d="m4 20 16-16"/></svg>
          </div>
        </div>
        <div class="form-options">
          <span class="remember">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m7 12 3 3 7-7"/></svg>
            Remember Me
          </span>
          <span class="link">Forgot Password?</span>
        </div>
        <button class="submit" type="button">Sign in securely</button>
        <div class="secure">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 19 6v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
          RA 10173 compliant. Records are encrypted and access is audited.
        </div>
      </section>
    </main>
  </div>
</div>
