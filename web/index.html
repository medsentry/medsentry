<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Offline-First Healthcare Management System for Rural Health Units">

  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.medsentryrhu.com/">

  <!-- Open Graph / Search Snippet Metadata -->
  <meta property="og:title" content="MedSentry - Healthcare Management System">
  <meta property="og:description" content="Offline-First Healthcare Management System for Rural Health Units (RHUs).">
  <meta property="og:url" content="https://www.medsentryrhu.com/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://www.medsentryrhu.com/icons/Icon-512.png">

  <!-- iOS / Safari meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MedSentry">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Windows / Edge meta tags -->
  <meta name="msapplication-TileColor" content="#0D9488">
  <meta name="msapplication-TileImage" content="icons/Icon-192.png">
  <meta name="theme-color" content="#0D9488">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MedSentry - Healthcare Management System</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      z-index: 99999;
      transition: opacity 0.35s ease;
    }
    .loading-logo {
      width: 64px;
      height: 64px;
      background: #0D9488;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.35);
      margin-bottom: 20px;
    }
    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #E2E8F0;
      border-top-color: #0D9488;
      border-radius: 50%;
      animation: ms-spin 0.8s linear infinite;
      margin-top: 16px;
    }
    @keyframes ms-spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 22px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.5px;
    }
    .loading-subtitle {
      font-size: 13px;
      color: #64748B;
      margin-top: 4px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="loading-logo">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6v12M6 12h12"/>
      </svg>
    </div>
    <div class="loading-title">MedSentry</div>
    <div class="loading-subtitle">Rural Health Management System</div>
    <div class="loading-spinner"></div>
    <div id="ms-error-display" style="display: none; margin-top: 20px; text-align: center; max-width: 340px;">
      <p id="ms-error-text" style="color: #DC2626; font-size: 13px; font-weight: 600; margin-bottom: 10px;">Failed to initialize application.</p>
      <button onclick="clearCacheAndReload()" style="padding: 8px 18px; background: #0D9488; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);">Reload MedSentry</button>
    </div>
  </div>

  <script>
    async function clearCacheAndReload() {
      try {
        if ('serviceWorker' in navigator) {
          var registrations = await navigator.serviceWorker.getRegistrations();
          for (var i = 0; i < registrations.length; i++) {
            await registrations[i].unregister();
          }
        }
        if ('caches' in window) {
          var keys = await caches.keys();
          for (var j = 0; j < keys.length; j++) {
            await caches.delete(keys[j]);
          }
        }
      } catch (e) {
        console.warn('Cache clearing error:', e);
      }
      window.location.href = window.location.origin + window.location.pathname + '?v=' + Date.now();
    }
    window.clearCacheAndReload = clearCacheAndReload;

    // 1. Bulletproof Loader Dismissal System
    var loaderHidden = false;
    function hideMedSentryLoader() {
      if (loaderHidden) return;
      var loader = document.getElementById('loading-container');
      if (loader) {
        loaderHidden = true;
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 350);
      }
    }

    window.hideMedSentryLoader = hideMedSentryLoader;
    window.addEventListener('flutter-first-frame', hideMedSentryLoader);

    // Watch for Flutter engine creating the view in the DOM
    var domObserver = new MutationObserver(function(mutations) {
      for (var i = 0; i < mutations.length; i++) {
        for (var j = 0; j < mutations[i].addedNodes.length; j++) {
          var node = mutations[i].addedNodes[j];
          if (node.nodeType === 1) {
            var tag = (node.tagName || '').toLowerCase();
            if (tag === 'flutter-view' || tag === 'flt-glass-pane' || (node.querySelector && node.querySelector('flutter-view, flt-glass-pane'))) {
              domObserver.disconnect();
              requestAnimationFrame(function() {
                setTimeout(hideMedSentryLoader, 80);
              });
              return;
            }
          }
        }
      }
    });
    domObserver.observe(document.body, { childList: true, subtree: true });

    // Pre-bootstrap Error Boundary: Prevent silent white screen on fatal module or network errors
    window.addEventListener('error', function(e) {
      if (loaderHidden) return;
      var isSyntaxErr = e.message && (e.message.includes('Unexpected token') || e.message.includes('SyntaxError'));
      if (isSyntaxErr) {
        console.warn('[MedSentry] Stale cache corruption detected. Purging service worker and caches...');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var r of regs) r.unregister();
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var name of names) caches.delete(name);
          });
        }
      }
      var loader = document.getElementById('loading-container');
      if (loader) {
        var errBox = document.getElementById('ms-error-display');
        var errText = document.getElementById('ms-error-text');
        var spinner = loader.querySelector('.loading-spinner');
        if (errBox && errText) {
          if (spinner) spinner.style.display = 'none';
          errText.textContent = isSyntaxErr
            ? 'Stale browser cache detected. Click below to clear cache and reload.'
            : (e.message ? ('Error: ' + e.message) : 'Failed to initialize application modules. Please reload.');
          errBox.style.display = 'block';
        }
      }
    });

    window.addEventListener('unhandledrejection', function(e) {
      if (loaderHidden) return;
      var loader = document.getElementById('loading-container');
      if (loader) {
        var errBox = document.getElementById('ms-error-display');
        var errText = document.getElementById('ms-error-text');
        var spinner = loader.querySelector('.loading-spinner');
        if (errBox && errText) {
          if (spinner) spinner.style.display = 'none';
          var reason = e.reason ? (e.reason.message || e.reason.toString()) : '';
          errText.textContent = reason ? ('Initialization error: ' + reason) : 'Failed to load application modules. Please reload.';
          errBox.style.display = 'block';
        }
      }
    });

    // 2. PWA Install Prompt Bridge
    let deferredInstallPrompt = null;
    window.pwaCanInstall = false;

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredInstallPrompt = e;
      window.pwaCanInstall = true;
      window.dispatchEvent(new CustomEvent('pwa-installable'));
      console.log('[MedSentry PWA] App is installable! Event captured.');
    });

    window.installMedSentryPwa = async function() {
      if (!deferredInstallPrompt) {
        console.warn('[MedSentry PWA] No installation prompt available.');
        return false;
      }
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      window.pwaCanInstall = false;
      return choice && choice.outcome === 'accepted';
    };

    window.isPwaInstalled = function() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true;
    };

    window.addEventListener('appinstalled', function() {
      window.pwaCanInstall = false;
      deferredInstallPrompt = null;
      console.log('[MedSentry PWA] App was successfully installed to device!');
    });

    // 3. Register Offline Service Worker (Skip during local DWDS debug development)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        var isDebugMode = window.location.port === '52137' ||
                          window.location.search.includes('flutter-web') ||
                          window.location.search.includes('dwds');

        if (isDebugMode) {
          console.log('[MedSentry] DWDS debug mode detected - clearing service worker to avoid cache conflicts.');
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var r of regs) r.unregister();
          });
          return;
        }

        navigator.serviceWorker.register('sw.js', { scope: './' })
          .then(function(registration) {
            console.log('[MedSentry PWA] Offline Service Worker registered:', registration.scope);

            registration.onupdatefound = function() {
              var newWorker = registration.installing;
              if (newWorker) {
                newWorker.onstatechange = function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[MedSentry PWA] New application version detected.');
                    window.dispatchEvent(new CustomEvent('pwa-update-available'));
                  }
                };
              }
            };
          })
          .catch(function(err) {
            console.warn('[MedSentry PWA] Service Worker registration skipped/failed:', err);
          });

        navigator.serviceWorker.addEventListener('controllerchange', function() {
          console.log('[MedSentry PWA] Controller updated. Auto-reloading with latest version.');
          window.location.reload();
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=1.0.4" async></script>
</body>
</html>
