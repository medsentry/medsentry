<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Offline-First Healthcare Management System for Rural Health Units">

  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.medsentryrhu.com/">

  <!-- Open Graph / Search Snippet Metadata -->
  <meta property="og:title" content="MedSentry - Healthcare Management System">
  <meta property="og:description" content="Offline-First Healthcare Management System for Rural Health Units (RHUs).">
  <meta property="og:url" content="https://www.medsentryrhu.com/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://www.medsentryrhu.com/icons/Icon-512.png">

  <!-- iOS / Safari meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MedSentry">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Windows / Edge meta tags -->
  <meta name="msapplication-TileColor" content="#080909">
  <meta name="msapplication-TileImage" content="icons/Icon-192.png">
  <meta name="theme-color" content="#080909">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MedSentry - Healthcare Management System</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #080909;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #080909;
      z-index: 99999;
      transition: opacity 0.35s ease;
    }
    .loading-logo {
      width: 64px;
      height: 64px;
      background: #111214;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(52, 211, 153, 0.25);
      margin-bottom: 20px;
    }
    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #34D399;
      border-radius: 50%;
      animation: ms-spin 0.8s linear infinite;
      margin-top: 16px;
    }
    @keyframes ms-spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 22px;
      font-weight: 800;
      color: #F3F4F6;
      letter-spacing: -0.5px;
    }
    .loading-subtitle {
      font-size: 13px;
      color: #9CA3AF;
      margin-top: 4px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="loading-logo">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6v12M6 12h12"/>
      </svg>
    </div>
    <div class="loading-title">MedSentry</div>
    <div class="loading-subtitle">Rural Health Management System</div>
    <div class="loading-spinner"></div>
    <div id="ms-error-display" role="alert" aria-live="assertive" style="display: none; margin-top: 20px; text-align: center; max-width: 340px;">
      <p id="ms-error-text" style="color: #F87171; font-size: 13px; font-weight: 600; margin-bottom: 10px;">Failed to initialize application.</p>
      <button id="ms-reload-button" type="button" style="padding: 8px 18px; background: #34D399; color: #080909; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; box-shadow: 0 4px 12px rgba(52, 211, 153, 0.25);">Reload MedSentry</button>
    </div>
  </div>

  <script src="app_startup.js?v=1.0.13"></script>
  <script src="flutter_bootstrap.js?v=1.0.13" async></script>
</body>
</html>
